<!doctype html><html lang="es"><meta charset="utf-8"><title>Validación de escalas E6B</title><style>body{font:16px system-ui;background:#07192b;color:white;padding:24px}.pass{color:#85f2b4}.fail{color:#ff8b8b}li{margin:7px 0}</style><h1>Validación geométrica del simulador E6B</h1><p>Verifica que las marcas del anillo interior y exterior quedan sobre la misma radial después de la alineación. Las potencias de diez deben interpretarse en el contexto del ejercicio.</p><ol id="results"></ol><h2 id="summary"></h2><script>
const examples=[['Tiempo: 55 km / 110 km/h = 30 min',11,60,55,30],['Distancia: 110 km/h × 30 min = 55 km',11,60,55,30],['Velocidad: 55 km / 30 min = 110 km/h',55,30,11,60],['Multiplicación: 12 × 7 = 84',12,10,84,70],['División: 740 / 37 = 20',74,37,20,10],['Consumo: 16 L/h × 2,5 h = 40 L',16,60,40,15],['Autonomía: 40 L / 16 L/h = 2,5 h',16,60,40,15]];
const ang=v=>360*Math.log10(v/10),err=(a,b)=>Math.abs(((a-b+540)%360)-180);let ok=0;
for(const [name,outer,inner,readOuter,readInner] of examples){const angle=ang(outer)-ang(inner),difference=err(angle+ang(readInner),ang(readOuter)),li=document.createElement('li');const pass=difference<1e-8;li.className=pass?'pass':'fail';li.textContent=(pass?'✓ ':'✗ ')+name+' · error angular: '+difference.toFixed(10)+'°';document.getElementById('results').append(li);if(pass)ok++}
document.getElementById('summary').textContent=ok+' de '+examples.length+' alineaciones correctas.';
</script>

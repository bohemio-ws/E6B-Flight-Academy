<!doctype html><html lang="es"><meta charset="utf-8"><title>Verificación geodésica WGS84</title><style>body{font:16px system-ui;background:#07192b;color:white;padding:25px}.pass{color:#91efb5}.fail{color:#ff9292}li{padding:5px}</style><h1>Verificación WGS84</h1><p>Casos de referencia geométricos, pruebas de simetría y de rumbo inverso.</p><ol id="results"></ol><h2 id="summary"></h2><script src="../js/geodesy.js"></script><script>
let count=0,fail=0;const $=id=>document.getElementById(id),g=E6BGeodesy.inverse;function near(a,b,t){if(!Number.isFinite(a)||Math.abs(a-b)>t)throw Error(a+' frente a '+b+' (tolerancia '+t+')')}function test(name,fn){count++;const li=document.createElement('li');try{fn();li.className='pass';li.textContent='✓ '+name}catch(e){fail++;li.className='fail';li.textContent='✗ '+name+': '+e.message}$('results').append(li)}
test('Mismo punto = 0 km',()=>near(g(40,-3,40,-3).km,0,1e-12));
test('Un grado de longitud en ecuador WGS84 = 111319.490793 m',()=>near(g(0,0,0,1).km,111.319490793,1e-7));
test('Un grado de latitud desde ecuador ≈ 110574.3886 m',()=>near(g(0,0,1,0).km,110.5743886,1e-5));
test('Rumbo ecuatorial al este = 90°',()=>near(g(0,0,0,1).initialBearingDeg,90,1e-8));
test('Rumbo meridiano al norte = 0°',()=>near(g(0,0,1,0).initialBearingDeg,0,1e-8));
test('Rechazo latitud inválida',()=>{let ok=false;try{g(91,0,0,0)}catch(e){ok=true}if(!ok)throw Error('No rechazó 91°')});
for(let i=0;i<20;i++){const lat=30+i/2,lon=-10+i/3,lat2=lat+0.8,lon2=lon+1.3;test('Simetría de distancia '+i,()=>{const a=g(lat,lon,lat2,lon2),b=g(lat2,lon2,lat,lon);near(a.km,b.km,1e-8);near((a.initialBearingDeg+180)%360,b.finalBearingDeg,1e-6)})}
$('summary').textContent=(count-fail)+' de '+count+' pruebas superadas';
</script></html>
